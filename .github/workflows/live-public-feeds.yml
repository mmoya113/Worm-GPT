name: Verify BRAVIA public live feeds

on:
  push:
    paths:
      - .github/workflows/live-public-feeds.yml

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Coinbase and DEX Screener live endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/feedtest && cd /tmp/feedtest
          npm init -y >/dev/null 2>&1
          npm install --silent ws@8
          cat > test.mjs <<'JS'
          import WebSocket from 'ws';
          import fs from 'node:fs';
          const report=[];
          const product=await fetch('https://api.coinbase.com/api/v3/brokerage/market/products?limit=100&product_type=SPOT');
          if(!product.ok)throw new Error(`Coinbase product endpoint ${product.status}`);
          const pj=await product.json();
          const usd=(pj.products||[]).filter(p=>p.quote_currency_id==='USD'&&!p.is_disabled&&p.status!=='offline');
          if(usd.length<20)throw new Error(`Only ${usd.length} usable Coinbase USD products`);
          report.push(`Coinbase product discovery: PASS (${usd.length} usable USD spot products returned)`);

          const profiles=await fetch('https://api.dexscreener.com/token-profiles/latest/v1');
          if(!profiles.ok)throw new Error(`DEX Screener profiles ${profiles.status}`);
          const pa=await profiles.json();
          const sol=(Array.isArray(pa)?pa:[pa]).filter(x=>x?.chainId==='solana'&&x.tokenAddress).slice(0,10);
          if(!sol.length)throw new Error('DEX Screener returned no Solana profiles');
          const pairs=await fetch(`https://api.dexscreener.com/tokens/v1/solana/${sol.map(x=>x.tokenAddress).join(',')}`);
          if(!pairs.ok)throw new Error(`DEX Screener token pairs ${pairs.status}`);
          const pairJson=await pairs.json();
          if(!Array.isArray(pairJson))throw new Error('DEX Screener pairs response not array');
          report.push(`DEX Screener Solana meme radar: PASS (${sol.length} fresh profiles, ${pairJson.length} pair rows)`);

          const ticker=await new Promise((resolve,reject)=>{
            const ws=new WebSocket('wss://advanced-trade-ws.coinbase.com');
            const timer=setTimeout(()=>{ws.terminate();reject(new Error('Coinbase WebSocket ticker timeout'))},12000);
            ws.on('open',()=>ws.send(JSON.stringify({type:'subscribe',product_ids:['BTC-USD','ETH-USD','SOL-USD'],channel:'ticker'})));
            ws.on('message',buf=>{try{const m=JSON.parse(buf.toString());if(m.channel==='ticker'&&m.events?.some(e=>e.tickers?.length)){clearTimeout(timer);ws.close();resolve(m)}}catch{}});
            ws.on('error',e=>{clearTimeout(timer);reject(e)});
          });
          report.push(`Coinbase WebSocket ticker: PASS (${ticker.events.flatMap(e=>e.tickers||[]).map(x=>x.product_id).filter(Boolean).slice(0,3).join(', ')})`);
          report.push('Overall public-feed connectivity: PASS');
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/docs/qa/LIVE_FEEDS.txt',report.join('\n')+'\n');
          console.log(report.join('\n'));
          JS
          node test.mjs
      - name: Commit connectivity report
        shell: bash
        run: |
          git config user.name 'BRAVIA QA'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/qa/LIVE_FEEDS.txt
          git commit -m 'Add BRAVIA live public feed QA report' || exit 0
          git push origin HEAD:main
