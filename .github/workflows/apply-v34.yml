name: Apply BRAVIA V3.4
on:
  push:
    paths:
      - .github/workflows/apply-v34.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V3.4 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('BRAVIA TRADING ENGINE // V3.3','BRAVIA TRADING ENGINE // V3.4')
          if 'v34.css' not in s: s=s.replace('</head>','  <link rel="stylesheet" href="v34.css?v=34" />\n</head>')
          if 'v34.js' not in s: s=s.replace('</body>','  <script src="v34.js?v=34"></script>\n</body>')
          p.write_text(s)
          sw=Path('sw.js')
          sw.write_text("""const CACHE='bravia-v34-shell';\nconst ASSETS=['./','./index.html','./style.css','./app.js?v=33','./v32.css?v=33','./v32.js?v=33','./v34.css?v=34','./v34.js?v=34','./icon.svg','./manifest.webmanifest'];\nself.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)))});\nself.addEventListener('activate',e=>e.waitUntil(Promise.all([self.clients.claim(),caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))])));\nself.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy)).catch(()=>{});return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html'))))});\n""")
          PY
          git config user.name "BRAVIA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Load BRAVIA V3.4 runtime and refresh cache"
          git push
