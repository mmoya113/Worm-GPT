name: Recover BRAVIA staged archive

on:
  push:
    paths:
      - .github/workflows/recover-bravia.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover complete files from staged archive
        shell: bash
        run: |
          set -u
          rm -rf recovered
          mkdir recovered
          cat .bootstrap/part* | base64 -d > /tmp/bravia.partial.gz
          gzip -dc /tmp/bravia.partial.gz > /tmp/bravia.partial.tar 2>/tmp/gzip.err || true
          tar -xf /tmp/bravia.partial.tar -C recovered --ignore-zeros 2>/tmp/tar.err || true
          printf 'gzip: ' > recovered/RECOVERY_REPORT.txt
          tr '\n' ' ' < /tmp/gzip.err >> recovered/RECOVERY_REPORT.txt || true
          printf '\ntar: ' >> recovered/RECOVERY_REPORT.txt
          tr '\n' ' ' < /tmp/tar.err >> recovered/RECOVERY_REPORT.txt || true
          printf '\n\nfiles:\n' >> recovered/RECOVERY_REPORT.txt
          find recovered -type f -printf '%P %s bytes\n' | sort >> recovered/RECOVERY_REPORT.txt
          git config user.name 'BRAVIA Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered
          git commit -m 'Recover staged BRAVIA V3 files' || exit 0
          git push origin HEAD:main
