name: Apply BRAVIA V3.2 runtime assets
on:
  push:
    paths:
      - .github/workflows/apply-v32.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V3.2 assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'v32.css' not in s:
              s=s.replace('</head>','  <link rel="stylesheet" href="v32.css?v=32" />\n</head>')
          if 'v32.js' not in s:
              s=s.replace('</body>','  <script src="v32.js?v=32"></script>\n</body>')
          p.write_text(s)
          PY
          git config user.name "BRAVIA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load BRAVIA V3.2 mobile and wallet patch"
          git push
