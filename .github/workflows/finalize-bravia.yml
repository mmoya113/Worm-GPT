name: Finalize BRAVIA V3 release

on:
  push:
    paths:
      - .github/workflows/finalize-bravia.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify tested release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f recovered/QA_STATIC.txt
          test -f recovered/QA_BROWSER.txt
          grep -q 'overall: PASS' recovered/QA_BROWSER.txt
          test -s recovered/assets/screenshot-desktop.png
          test -s recovered/assets/screenshot-mobile.png
          node --check recovered/app.js
          node --check recovered/server/index.mjs
      - name: Promote tested V3 to repository root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('recovered/README.md');s=p.read_text()
          old='<img src="assets/ui-preview.svg" alt="BRAVIA visual direction" width="900" />\n\n> UI map of the shipped neon/HUD layout. The running dashboard is generated by `index.html + style.css + app.js` and is responsive for desktop and iPhone.'
          new='<img src="assets/screenshot-desktop.png" alt="BRAVIA verified desktop dashboard" width="900" />\n\n<img src="assets/screenshot-mobile.png" alt="BRAVIA verified iPhone dashboard" width="330" />\n\n> ✅ Real screenshots generated by the browser QA suite after testing the shipped dashboard at desktop and iPhone-sized viewports.'
          if old in s:s=s.replace(old,new)
          if '## 🧪 Verified release QA' not in s:
              s+='''\n---\n\n## 🧪 Verified release QA\n\nBefore promotion to `main`, BRAVIA V3 was tested in a real headless Chromium browser at **1440×1050 desktop** and **393×852 iPhone-sized** viewports. The suite opened Paper mode, started the bot, rendered the chart, navigated the major views, enabled Meme Normal, armed FAST Sniper and launched all eight Strategy Arena wallets.\n\n- ✅ JavaScript syntax: PASS\n- ✅ Backend syntax: PASS\n- ✅ Missing HTML/JS element references: 0\n- ✅ Duplicate HTML IDs: 0\n- ✅ Desktop browser errors: 0\n- ✅ Mobile browser errors: 0\n- ✅ Desktop chart: 634×317 in QA viewport\n- ✅ Mobile chart: 351×245 in QA viewport\n- ✅ Strategy Arena wallets rendered: 8\n- ✅ Overall browser smoke test: PASS\n\nExact reports live under [`docs/qa/`](docs/qa/). This verifies the tested UI/code path; it does not guarantee trading profitability or third-party API uptime.\n'''
          p.write_text(s)
          PY
          rm -f README.md app.js index.html style.css icon.svg manifest.webmanifest SECURITY.md sw.js render.yaml
          rm -rf assets docs server
          cp recovered/README.md README.md
          cp recovered/app.js app.js
          cp recovered/index.html index.html
          cp recovered/style.css style.css
          cp recovered/icon.svg icon.svg
          cp recovered/manifest.webmanifest manifest.webmanifest
          cp recovered/SECURITY.md SECURITY.md
          cp recovered/sw.js sw.js
          cp recovered/render.yaml render.yaml
          cp -a recovered/assets assets
          cp -a recovered/docs docs
          cp -a recovered/server server
          mkdir -p docs/qa
          cp recovered/QA_STATIC.txt docs/qa/STATIC.txt
          cp recovered/QA_BROWSER.txt docs/qa/BROWSER.txt
          cp recovered/.gitignore .gitignore
          touch .nojekyll
          rm -rf recovered .bootstrap
          rm -f .phase3-probe
          node --check app.js
          node --check server/index.mjs
          grep -q 'overall: PASS' docs/qa/BROWSER.txt
          grep -q 'app.js syntax: PASS' docs/qa/STATIC.txt
          test -s assets/screenshot-desktop.png
          test -s assets/screenshot-mobile.png
          git config user.name 'BRAVIA Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- ':!.github'
          git commit -m 'Ship BRAVIA Trading Engine V3 — Phase 2 + Phase 3'
          git push origin HEAD:main
