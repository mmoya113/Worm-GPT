name: BRAVIA V3.3 Browser QA
on:
  push:
    paths:
      - .github/workflows/browser-v33.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run BRAVIA UI regression
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/bravia-http.log 2>&1 &
          cat > /tmp/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:393,height:852},isMobile:true,hasTouch:true});
          const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:8080/?demo=1&v=33',{waitUntil:'networkidle'});
          await page.locator('#choosePaper').click();
          await page.locator('[data-view="memes"]').last().click();
          await page.waitForSelector('#memeWalletCard',{state:'visible'});
          const memeText=await page.locator('#memeWalletCard').innerText();
          if(!memeText.includes('MEME NORMAL WALLET')||!memeText.includes('$10.00')) throw new Error('Meme wallet missing/bad');
          await page.locator('[data-view="sniper"]').last().click();
          await page.waitForSelector('#sniperWalletCard',{state:'visible'});
          const sniperText=await page.locator('#sniperWalletCard').innerText();
          if(!sniperText.includes('SNIPER WALLET')||!sniperText.includes('$10.00')) throw new Error('Sniper wallet missing/bad');
          await page.locator('[data-view="arena"]').last().click();
          await page.waitForSelector('[data-arena-id]');
          await page.locator('[data-arena-id]').first().click();
          await page.waitForSelector('#arenaDetailModal:not(.hidden)',{state:'visible'});
          if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
          console.log('PASS meme wallet + sniper wallet + arena drilldown + mobile taps');
          await browser.close();
          JS
          node /tmp/qa.mjs
