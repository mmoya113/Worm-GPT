name: BRAVIA V3.4 Browser QA
on:
  push:
    paths:
      - .github/workflows/qa-v34.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run mobile UI regression
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          cat > qa34.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:393,height:852},isMobile:true,hasTouch:true});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:8080/?demo=1&v=34',{waitUntil:'networkidle'});
          await page.locator('#choosePaper').click();
          await page.waitForSelector('#resetNormalWallet',{state:'visible'});
          await page.locator('#resetNormalWallet').click();
          if((await page.locator('#equity').innerText()).trim()!=='$10.00') throw Error('Normal reset failed');
          await page.locator('.mobile-nav [data-view="memes"]').click();
          await page.waitForSelector('#memeOpportunityBoard',{state:'visible'});
          await page.waitForSelector('#memeWalletCard',{state:'visible'});
          await page.locator('.mobile-nav [data-view="sniper"]').click();
          await page.waitForSelector('#freshnessRule',{state:'visible'});
          const fresh=await page.locator('#freshnessRule').innerText();if(!fresh.includes('60 seconds')) throw Error('60s sniper rule missing');
          const rugCount=await page.locator('.mobile-nav [data-view="rugcheck"]').count();if(!rugCount) throw Error('RugCheck missing from mobile nav');
          await page.locator('.mobile-nav [data-view="arena"]').click();
          await page.locator('#arenaToggle').click();
          await page.waitForTimeout(4200);
          await page.locator('[data-arena-id]').first().click();
          await page.waitForSelector('#arenaDetailModal:not(.hidden)',{state:'visible'});
          const detail=await page.locator('#arenaModalBody').innerText();if(!detail.includes('Action timeline')) throw Error('Arena drilldown missing');
          if(errors.length) throw Error('Page errors: '+errors.join(' | '));
          console.log('PASS V3.4: reset + meme radar + sniper 60s guard UI + mobile rug nav + arena drilldown');
          await browser.close();
          JS
          node qa34.mjs
