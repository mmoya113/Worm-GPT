name: Expand BRAVIA meme universe

on:
  push:
    paths:
      - .github/workflows/add-meme-universe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add Birdeye meme-universe API and frontend use
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('server/index.mjs')
          s=p.read_text()
          marker="app.get('/api/security/:ca', async (req,res) => {"
          assert marker in s
          block=r'''
function birdeyeMemeToPair(item={}){
  const address=item.address||item.token_address||item.tokenAddress||item.mint||'';
  const trades=safe(item.trade_5m_count ?? item.trade5m ?? item.trades_5m ?? item.txns_5m);
  let buys=safe(item.buy_5m_count ?? item.buy5m ?? item.buys_5m ?? item.buy_count_5m);
  let sells=safe(item.sell_5m_count ?? item.sell5m ?? item.sells_5m ?? item.sell_count_5m);
  if(!buys&&!sells&&trades){buys=Math.ceil(trades/2);sells=Math.floor(trades/2)}
  const created=safe(item.creation_time ?? item.created_at ?? item.recent_listing_time ?? item.listing_time);
  return {
    chainId:'solana',dexId:item.source||item.platform||'birdeye',
    baseToken:{address,name:item.name||item.token_name||'Unknown',symbol:item.symbol||item.token_symbol||'MEME'},
    priceUsd:String(item.price ?? item.price_usd ?? 0),
    liquidity:{usd:safe(item.liquidity ?? item.liquidity_usd)},
    marketCap:safe(item.market_cap ?? item.marketCap ?? item.mc),
    fdv:safe(item.fdv),
    pairCreatedAt:created ? (created<1e12?created*1000:created) : 0,
    volume:{m5:safe(item.volume_5m_usd ?? item.volume5m ?? item.volume_5m)},
    txns:{m5:{buys,sells}},
    info:{imageUrl:item.logo_uri||item.logoURI||item.image||item.icon||''},
    _birdeye:item
  };
}

app.get('/api/memes', async (req,res) => {
  if(!BIRDEYE_API_KEY)return res.status(503).json({error:'BIRDEYE_API_KEY not configured'});
  const offset=Math.min(10000,Math.max(0,Number(req.query.offset)||0));
  const limit=Math.min(100,Math.max(1,Number(req.query.limit)||100));
  const sortBy=String(req.query.sort_by||'liquidity').replace(/[^a-zA-Z0-9_]/g,'');
  const sortType=req.query.sort_type==='asc'?'asc':'desc';
  const u=new URL('https://public-api.birdeye.so/defi/v3/token/meme/list');
  u.searchParams.set('sort_by',sortBy);u.searchParams.set('sort_type',sortType);u.searchParams.set('source','all');u.searchParams.set('offset',String(offset));u.searchParams.set('limit',String(limit));
  try{
    const j=await okJson(await timeoutFetch(u,{headers:{'X-API-KEY':BIRDEYE_API_KEY,'x-chain':'solana'}},10000));
    const raw=j?.data?.items||j?.data?.tokens||j?.data?.list||j?.items||j?.data||[];
    const items=(Array.isArray(raw)?raw:[]).map(birdeyeMemeToPair).filter(x=>x.baseToken.address);
    res.json({offset,limit,count:items.length,nextOffset:offset+items.length,items});
  }catch(e){res.status(502).json({error:e.message})}
});

'''
          s=s.replace(marker,block+marker)
          p.write_text(s)

          p=Path('app.js');s=p.read_text()
          old="async function refreshMemes(){if(DEMO){seedDemoMemes();return}try{const p=await fetch('https://api.dexscreener.com/token-profiles/latest/v1',{cache:'no-store'});"
          new="async function refreshMemes(){if(DEMO){seedDemoMemes();return}try{if(state.backendOk){try{const br=await fetch(`${state.backend.replace(/\\/$/,'')}/api/memes?limit=100&offset=0`,{cache:'no-store',signal:AbortSignal.timeout(8000)});if(br.ok){const bj=await br.json(),bi=Array.isArray(bj.items)?bj.items:[];if(bi.length){for(const pair of bi){pair._risk=scoreMeme(pair);const ca=pair.baseToken?.address;if(ca)state.memeByAddress[ca]=pair}const existing=new Map(state.memePairs.map(x=>[x.baseToken?.address,x]));for(const pair of bi)existing.set(pair.baseToken?.address,pair);state.memePairs=[...existing.values()].filter(x=>x?.baseToken?.address).sort((a,b)=>(b._risk?.score||0)-(a._risk?.score||0)).slice(0,100);$('memeSourceBadge').textContent='BIRDEYE UNIVERSE + DEX';renderMemes()}}}catch{}}const p=await fetch('https://api.dexscreener.com/token-profiles/latest/v1',{cache:'no-store'});"
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('docs/API_SETUP.md');s=p.read_text()
          s=s.replace('two independent real-time Solana detection paths (Helius + Birdeye), GoPlus security enrichment, Helius RPC reads, Jupiter quote modelling and the optional OpenAI supervisor.','two independent real-time Solana detection paths (Helius + Birdeye), the paginated Birdeye meme universe, GoPlus security enrichment, Helius RPC reads, Jupiter quote modelling and the optional OpenAI supervisor.')
          s=s.replace('| Birdeye | independent real-time new-listing stream + holder/security intelligence | Yes | 🟡 Helius + public fallback can still run |','| Birdeye | independent real-time new-listing stream + paginated meme universe + holder/security intelligence | Yes | 🟡 Helius + public fallback can still run |')
          s += '\n## Meme-universe endpoint\n\nWith `BIRDEYE_API_KEY` configured, `GET /api/memes?offset=0&limit=100` proxies Birdeye Meme Token List through the private backend and normalizes records for BRAVIA. The upstream API supports pagination up to offset 10,000 with up to 100 records per request. The dashboard loads the first ranked page for fast scanning; the endpoint can be paged by future clients without exposing the key.\n'
          p.write_text(s)

          p=Path('README.md');s=p.read_text()
          s=s.replace('| Meme Radar + Normal mode | ✅ | Public DEX Screener fallback, automatic paper mode + backend upgrade path |','| Meme Radar + Normal mode | ✅ | Public DEX Screener fallback + Birdeye paginated meme universe, automatic paper mode |')
          p.write_text(s)
          PY
          set -e
          node --check app.js
          node --check server/index.mjs
          git config user.name 'BRAVIA Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js server/index.mjs docs/API_SETUP.md README.md
          git commit -m 'Add paginated Birdeye meme universe to BRAVIA V3.2' || exit 0
          git push origin HEAD:main
